<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대시보드 - Samsung App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .navbar {
            background: white;
            padding: 20px 40px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .navbar h1 {
            color: #333;
            font-size: 24px;
        }
        .navbar a {
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: transform 0.2s;
        }
        .navbar a:hover {
            transform: translateY(-2px);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            margin: 0 auto;
        }
        .welcome {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .welcome h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }
        .welcome p {
            color: #666;
            font-size: 16px;
        }
        .feature {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }
        .feature h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .feature p {
            color: #666;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>Samsung App</h1>
        <a href="{{ url_for('logout') }}">로그아웃</a>
    </div>

    <div class="container">
        <div class="welcome">
            <h2>환영합니다, {{ user.username }}!</h2>
            <p>대시보드에 오신 것을 환영합니다.</p>
        </div>

        <div class="feature">
            <h3>📊 기능 1</h3>
            <p>앱의 첫 번째 기능에 대한 설명입니다.</p>
        </div>

        <div class="feature">
            <h3>⚙️ 기능 2</h3>
            <p>앱의 두 번째 기능에 대한 설명입니다.</p>
        </div>

        <div class="feature">
            <h3>🔐 기능 3</h3>
            <p>앱의 세 번째 기능에 대한 설명입니다.</p>
        </div>
    </div>
</body>
</html>
