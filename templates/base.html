<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Samsung Seoul Hospital{% endblock %}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f7fc !important;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }


        nav {
            background: linear-gradient(90deg, #4a5aa0 0%, #5f6fbf 100%);
            padding: 0.7rem 0;
            color: white;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.2rem;
            max-width: 1200px;
            margin: 0 auto;
            align-items: center;
            flex-wrap: wrap;
            padding: 0 1rem;
            justify-content: space-between;
            width: 100%;
        }

        nav a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
            font-size: 0.8rem;
            letter-spacing: -0.2px;
        }

        nav a:hover {
            opacity: 1;
        }

        nav .brand {
            font-size: 0.95rem;
            font-weight: 600;
            white-space: nowrap;
            flex-grow: 1;
            display: flex;
            align-items: center;
            height: 40px;
            gap: 10px;
        }

        nav .brand img {
            height: 30px;
            width: auto;
            display: block;
        }

        nav .brand-text {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
        }

        nav .user-info {
            display: flex;
            gap: 1rem;
            align-items: center;
            font-size: 0.8rem;
            margin-left: auto;
        }

        nav .user-info span {
            color: rgba(255, 255, 255, 0.85);
        }

        nav .user-info a {
            color: rgba(255, 255, 255, 0.9);
        }

        .container {
            flex: 1;
            max-width: 100%;
            margin: 1rem auto;
            width: 100%;
            padding: 0 0.8rem;
        }

        @media (max-width: 768px) {
            nav ul {
                gap: 0.8rem;
            }

            nav a {
                font-size: 0.85rem;
            }

            nav .brand {
                font-size: 1rem;
            }

            nav .user-info {
                gap: 0.6rem;
                font-size: 0.8rem;
            }

            .container {
                padding: 0 0.5rem;
                margin: 0.8rem auto;
            }
        }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if 'user_id' in session %}
    <nav>
        <ul>
            <li><a href="/" class="brand"><img src="/static/images/smc-tagline.png" alt="SMC"><span class="brand-text">면접 준비앱</span></a></li>
            <li><a href="/board">게시판</a></li>
            <li><a href="/hospital">병원 정보</a></li>
            <li><a href="/analysis">분석</a></li>
            <li><a href="/developer">개발자정보</a></li>
            <li class="user-info">
                <span>{{ session.username }}</span>
                <a href="/logout">로그아웃</a>
            </li>
        </ul>
    </nav>
    {% endif %}

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
