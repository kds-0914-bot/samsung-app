<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - Samsung Seoul Hospital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
        }

        .signup-header {
            text-align: center;
            color: white;
            padding: 0;
            font-size: 1.2rem;
            font-weight: 600;
            flex-shrink: 0;
            display: none;
        }

        .signup-header img {
            height: 40px;
            width: auto;
        }

        .signup-header span {
            display: block;
            font-size: 1rem;
        }

        .signup-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem;
            gap: 2rem;
        }

        .signup-box {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 85%;
            max-width: 320px;
            position: relative;
        }

        .signup-box::before {
            content: '';
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background: url('/static/images/smc-logo.png') center/contain no-repeat;
        }

        .signup-box h1 {
            text-align: center;
            color: #333;
            margin-bottom: 1.3rem;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.3rem;
            color: #666;
            font-weight: 500;
            font-size: 0.85rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.6rem 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.9rem;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.4);
        }

        .form-group button {
            width: 100%;
            padding: 0.7rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .form-group button:active {
            transform: translateY(1px);
        }

        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 0.75rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            border: 1px solid #f5c6cb;
        }

        .login-link {
            text-align: center;
            margin-top: 1rem;
            color: #666;
            font-size: 0.8rem;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:active {
            opacity: 0.8;
        }

        footer {
            background-color: rgba(0, 0, 0, 0.15);
            color: white;
            text-align: center;
            padding: 0.6rem 0.8rem;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            width: 100%;
            flex-shrink: 0;
        }

        .footer-content {
            max-width: 100%;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 1rem 0.8rem;
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }

        .footer-item {
            padding: 0.2rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
            align-items: center;
            text-align: center;
        }

        .footer-item strong {
            display: block;
            font-size: 0.55rem;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .footer-item span {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
        }

        .footer-copyright {
            font-size: 0.6rem;
            opacity: 0.6;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 0.4rem;
            line-height: 1.3;
        }

        @media (max-width: 768px) {
            .signup-header {
                padding: 1.5rem 1rem 0.8rem;
                font-size: 1.1rem;
            }

            .signup-container {
                flex: 1;
                padding: 1rem;
            }

            .signup-box {
                width: 85%;
                max-width: 100%;
                padding: 1.2rem;
            }

            .signup-box h1 {
                font-size: 1.3rem;
                margin-bottom: 1.1rem;
            }

            .form-group {
                margin-bottom: 0.9rem;
            }

            .form-group input,
            .form-group button {
                font-size: 0.85rem;
                padding: 0.6rem 0.65rem;
            }

            footer {
                padding: 0.5rem 0.6rem;
            }

            .footer-content {
                gap: 0.6rem 0.5rem;
                margin-bottom: 0.4rem;
                grid-template-columns: repeat(5, 1fr);
            }

            .footer-item {
                padding: 0.15rem 0;
            }

            .footer-item strong {
                font-size: 0.5rem;
            }

            .footer-item span {
                font-size: 0.6rem;
            }

            .footer-copyright {
                font-size: 0.55rem;
                padding-top: 0.3rem;
            }
        }
    </style>
</head>
<body>
    <div class="signup-header">
        <img src="/static/images/smc-logo.png" alt="SMC">
        <span>면접 준비앱</span>
    </div>

    <div class="signup-container">
        <div class="signup-box">
            <h1>회원가입</h1>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form method="POST">
                <div class="form-group">
                    <label for="username">사용자명</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" name="password" required>
                </div>

                <div class="form-group">
                    <label for="confirm_password">비밀번호 확인</label>
                    <input type="password" id="confirm_password" name="confirm_password" required>
                </div>

                <div class="form-group">
                    <button type="submit">회원가입</button>
                </div>
            </form>

            <div class="login-link">
                이미 계정이 있으신가요? <a href="/login">로그인</a>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <div class="footer-item">
                <strong>Platform</strong>
                <span>Microsoft Azure</span>
            </div>
            <div class="footer-item">
                <strong>Instance</strong>
                <span>B1 Standard</span>
            </div>
            <div class="footer-item">
                <strong>Region</strong>
                <span>Korea Central</span>
            </div>
            <div class="footer-item">
                <strong>Database</strong>
                <span>PostgreSQL 13</span>
            </div>
            <div class="footer-item">
                <strong>Status</strong>
                <span>Operational</span>
            </div>
        </div>
        <div class="footer-copyright">
            Copyright © 2026 DaeseokKim. All Rights Reserved.
        </div>
    </footer>
</body>
</html>
